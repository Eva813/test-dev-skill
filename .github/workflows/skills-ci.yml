name: Skills CI

on:
  push:
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ci.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skills-ci.yml'

jobs:
  lint:
    name: Validate Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate all Skills
        run: |
          uvx skillscheck@0.9.7 ./skills
